# ============================================================
# 服务器外层 nginx-gateway 站点配置（TLS 终结 + 回源本栈前端容器）
# 存放于服务器网关容器/宿主机的 conf.d 目录，非本栈 docker-compose 的一部分。
#
# 前提：网关容器已接入 docker 网络 `gateway`（本栈 compose 声明了该外部网络，
# 前端容器 tc-agent-frontend 挂在其上，网关按服务名回源即可）。
#
# 证书：路径按实际调整；Let's Encrypt 可用 certbot 签发：
#   certbot certonly --nginx -d tankpizza.cn -d www.tankpizza.cn
# ============================================================

# HTTP 统一 301 到 https://www.tankpizza.cn
server {
  listen 80;
  listen [::]:80;
  server_name tankpizza.cn www.tankpizza.cn;
  return 301 https://www.tankpizza.cn$request_uri;
}

# 裸域 https 301 到 www
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tankpizza.cn;

  ssl_certificate     /etc/letsencrypt/live/tankpizza.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tankpizza.cn/privkey.pem;

  return 301 https://www.tankpizza.cn$request_uri;
}

# 主站
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.tankpizza.cn;

  ssl_certificate     /etc/letsencrypt/live/tankpizza.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tankpizza.cn/privkey.pem;

  # 按需收紧：TLS1.2+，常见套件即可
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 10m;

  # 全部流量回源到本栈前端容器（其内部 nginx 再把 /api 反代到后端）。
  # 网关侧同样关闭缓冲，保证 /api/chat/stream 的 SSE 逐字输出不被攒包。
  location / {
    proxy_pass http://tc-agent-frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
