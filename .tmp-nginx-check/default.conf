server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 寰俊缇よ亰璁板綍绛夎緝澶ц姹備綋
  client_max_body_size 10m;

  # 鍚庣 API锛氬悓婧?/api 鍘熸牱杞彂锛堝悗绔矾鐢辨湰韬甫 /api 鍓嶇紑锛夈€?
  # upstream 鐢ㄥ彉閲?+ Docker 鍐呯疆 resolver锛屽悗绔鍣ㄩ噸寤烘崲 IP 鍚庢棤闇€閲嶅惎鏈鍣ㄣ€?
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://tc-agent-backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE 娴佸紡杈撳嚭锛?api/chat/stream锛夛細鍏抽棴缂撳啿锛屾媺闀胯瓒呮椂绛?LLM 闀垮洖澶?
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # SPA锛氭墍鏈夎矾寰勫厹搴曞洖 index.html锛堝惈 /assets 绛夐潤鎬佽祫婧愮敱 try_files 浼樺厛鍛戒腑锛?
  location / {
    try_files $uri $uri/ /index.html;
  }
}